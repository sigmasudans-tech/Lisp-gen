workflows:
  unsigned-ios-ipa:
    name: Build unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build iOS app without code signing
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH" || { echo "Runner.app was not produced"; exit 1; }
          mkdir -p build/ios/unsigned/Payload
          rm -rf build/ios/unsigned/Payload/Runner.app
          cp -R "$APP_PATH" build/ios/unsigned/Payload/Runner.app
          cd build/ios/unsigned
          /usr/bin/zip -qry lispgen-unsigned.ipa Payload
    artifacts:
      - build/ios/unsigned/*.ipa
      - build/ios/iphoneos/Runner.app
